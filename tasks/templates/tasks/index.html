<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taskboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#eef1f5;--card:#fff;--ink:#17233b;--muted:#69758c;--line:#dde3ec;--brand:#3b5bdb;--brand-soft:#e4eaff;
--low:#2f8f6b;--medium:#d9921f;--high:#d6454f;--radius:14px}
@media(prefers-color-scheme:dark){:root{--paper:#0f1626;--card:#18223a;--ink:#e9eefb;--muted:#9aa6c0;--line:#27324f;--brand:#7c93ff;--brand-soft:#232f57}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0}
.app{max-width:1080px;margin:0 auto;padding:40px 20px;display:grid;grid-template-columns:340px 1fr;gap:28px}
@media(max-width:820px){.app{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.brand{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.sub{color:var(--muted);margin:8px 0 22px}
.ring-wrap{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.ring{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none;transition:background .4s}
.ring span{width:64px;height:64px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:700 1.1rem 'Bricolage Grotesque'}
.ring-wrap p{margin:0;color:var(--muted)} .ring-wrap strong{color:var(--ink);display:block;font-size:1.05rem}
label{display:block;font-weight:600;font-size:.88rem;margin:14px 0 6px}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
textarea{resize:vertical;min-height:70px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:10px;padding:12px 16px;font:600 1rem Figtree;cursor:pointer;background:var(--brand);color:#fff;width:100%;margin-top:18px}
.btn:hover{filter:brightness(1.08)}
.err{color:var(--high);font-size:.85rem;min-height:1.2em;margin-top:8px}
.toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:12px}
.tabs button{border:0;background:none;color:var(--muted);padding:7px 14px;border-radius:9px;font:600 .9rem Figtree;cursor:pointer}
.tabs button.on{background:var(--brand-soft);color:var(--brand)}
.task{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--medium);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px}
.task.low{border-left-color:var(--low)}.task.high{border-left-color:var(--high)}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:none;cursor:pointer;flex:none;margin-top:2px;color:#fff;font-size:15px;line-height:1}
.task.done .check{background:var(--low);border-color:var(--low)}
.body{flex:1;min-width:0}
.body h3{margin:0;font-size:1.05rem;word-break:break-word}
.task.done h3{text-decoration:line-through;color:var(--muted)}
.body p{margin:4px 0 8px;color:var(--muted);font-size:.93rem}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.chip{padding:2px 9px;border-radius:99px;background:var(--brand-soft);color:var(--brand);font-weight:600}
.chip.over{background:#fde8ea;color:var(--high)}
.icons{display:flex;gap:4px}
.icons button{border:0;background:none;cursor:pointer;color:var(--muted);padding:6px 8px;border-radius:8px;font-size:.85rem;font-weight:600}
.icons button:hover{background:var(--brand-soft);color:var(--brand)}
.icons .del:hover{background:#fde8ea;color:var(--high)}
.empty{text-align:center;padding:48px 20px;color:var(--muted);border:2px dashed var(--line);border-radius:var(--radius)}
.empty strong{display:block;color:var(--ink);font:700 1.2rem 'Bricolage Grotesque';margin-bottom:4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel" style="align-self:start">
    <div class="brand">Taskboard</div>
    <p class="sub">Plan the day, finish the list.</p>
    <div class="ring-wrap">
      <div class="ring" id="ring"><span id="pct">0%</span></div>
      <p><strong id="countTxt">0 of 0 done</strong>Keep going.</p>
    </div>
    <h2 id="formTitle" style="font-size:1.2rem">New task</h2>
    <form id="form" onsubmit="return false">
      <label for="title">Title</label>
      <input id="title" maxlength="200" placeholder="e.g. Send project report">
      <label for="desc">Notes</label>
      <textarea id="desc" placeholder="Optional details"></textarea>
      <div class="row">
        <div><label for="priority">Priority</label>
          <select id="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></div>
        <div><label for="due">Due date</label><input type="date" id="due"></div>
      </div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn" id="save">Add task</button>
      <button class="btn" id="cancel" type="button" style="display:none;background:var(--brand-soft);color:var(--brand);margin-top:8px">Cancel edit</button>
    </form>
  </aside>

  <main>
    <div class="toolbar">
      <h2 style="font-size:1.5rem">Your tasks</h2>
      <div class="tabs" id="tabs">
        <button data-f="all" class="on">All</button><button data-f="open">Open</button><button data-f="done">Done</button>
      </div>
    </div>
    <div id="list"></div>
  </main>
</div>

<script>
const API='/api/tasks/';
let tasks=[], filter='all', editingId=null;
const $=id=>document.getElementById(id);

async function api(url,method='GET',body){
  const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const data=r.status===204?null:await r.json();
  if(!r.ok) throw data; return data;
}
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load(){tasks=await api(API);render();}

function render(){
  const done=tasks.filter(t=>t.completed).length, pct=tasks.length?Math.round(done/tasks.length*100):0;
  $('ring').style.setProperty('--p',pct);$('pct').textContent=pct+'%';
  $('countTxt').textContent=`${done} of ${tasks.length} done`;
  const shown=tasks.filter(t=>filter==='all'||(filter==='done')===t.completed);
  const today=new Date().toISOString().slice(0,10);
  $('list').innerHTML=shown.length?shown.map(t=>{
    const over=t.due_date&&!t.completed&&t.due_date<today;
    return `<div class="task ${t.priority} ${t.completed?'done':''}">
      <button class="check" onclick="toggle(${t.id})" aria-label="Mark ${t.completed?'open':'done'}">${t.completed?'✓':''}</button>
      <div class="body"><h3>${esc(t.title)}</h3>${t.description?`<p>${esc(t.description)}</p>`:''}
        <div class="meta"><span class="chip">${t.priority} priority</span>${t.due_date?`<span class="chip ${over?'over':''}">${over?'Overdue · ':'Due '}${t.due_date}</span>`:''}</div></div>
      <div class="icons"><button onclick="edit(${t.id})">Edit</button><button class="del" onclick="remove(${t.id})">Delete</button></div></div>`}).join('')
   :`<div class="empty"><strong>${tasks.length?'Nothing here':'No tasks yet'}</strong>${tasks.length?'Try another filter.':'Add your first task using the form.'}</div>`;
}

$('save').onclick=async()=>{
  $('err').textContent='';
  const payload={title:$('title').value,description:$('desc').value,priority:$('priority').value,due_date:$('due').value||null};
  try{
    if(editingId) await api(`${API}${editingId}/`,'PUT',{...payload,completed:tasks.find(t=>t.id===editingId).completed});
    else await api(API,'POST',payload);
    reset();load();
  }catch(e){$('err').textContent=Object.values(e).flat().join(' ');}
};
async function toggle(id){const t=tasks.find(x=>x.id===id);await api(`${API}${id}/`,'PATCH',{completed:!t.completed});load();}
async function remove(id){if(confirm('Delete this task?')){await api(`${API}${id}/`,'DELETE');if(editingId===id)reset();load();}}
function edit(id){
  const t=tasks.find(x=>x.id===id);editingId=id;
  $('title').value=t.title;$('desc').value=t.description;$('priority').value=t.priority;$('due').value=t.due_date||'';
  $('formTitle').textContent='Edit task';$('save').textContent='Save changes';$('cancel').style.display='block';$('title').focus();
}
function reset(){editingId=null;$('form').reset();$('formTitle').textContent='New task';$('save').textContent='Add task';$('cancel').style.display='none';$('err').textContent='';}
$('cancel').onclick=reset;
$('tabs').onclick=e=>{if(!e.target.dataset.f)return;filter=e.target.dataset.f;
  [...$('tabs').children].forEach(b=>b.classList.toggle('on',b===e.target));render();};
load();
</script>
</body>
</html>
